# Example only — do not enable until Phase 7.
# Copy to /etc/ssh/sshd_config.d/hogwarts.conf after user `play` exists
# and hp-session is installed. Then: sudo systemctl reload sshd

Match User play
    ForceCommand /usr/local/bin/hp-session
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY yes
    AllowAgentForwarding no
